<!DOCTYPE html>
<html lang="ua">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Планувальник подорожей</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Asap+Sharp:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel" src="js/script.js"></script>
  </head>
  <body>
    <!-- Шапка з назвою -->
    <header id="navigation">
      <h1>Планувальник подорожей</h1>
      <nav>
        <a href="#/" data-link>Мої поїздки</a>
      </nav>
    </header>
    <div class="wrapper">
      <main id="app"></main>
      <!-- Блок бюджету подорожі  -->
      <aside id="budget">
        <h2>Бюджет подорожі</h2>
        <p><span>Переліт (квитки):</span> <span>$800</span></p>
        <p><span>Проживання (готель):</span> <span>$1000</span></p>
        <p><span>Харчування:</span> <span>$500</span></p>
        <p><span>Екскурсії та розваги:</span> <span>$217</span></p>

        <h3>Всього: $2517</h3>
      </aside>
    </div>
    <!-- Підвал -->
    <footer id="footer">
      <p>
        Сайт підготовлено Солодовником Тимофієм <br />
        Мета - опанування засобів та технологій веб-розробки <br />
        2026
      </p>
    </footer>
  </body>
</html>
